name: hisab_master
description: "Hisab Master - Expense and Income Tracker"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.4
  google_sign_in: ^6.2.2
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.69.2
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  pdf: ^3.13.1
  file_picker: ^8.1.6
  home_widget: ^0.7.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "docs/logo.png"
  adaptive_icon_background: "#0B3D2E"
  adaptive_icon_foreground: "docs/logo_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
